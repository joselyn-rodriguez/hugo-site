[build.environment]
GO_VERSION = "1.27.3"
HUGO_VERSION = "0.169.0"
NODE_VERSION = "24.22.1"
TZ = "Europe/Oslo"

[build]
publish = "public"
command = """\
  git config --global core.quotepath false && \
  hugo build --gc --minify --baseURL "${URL}"
  """

[caches]
  [caches.images]
    dir = ':cacheDir/images'
