[markup]
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4

[params]

  colortheme = "classic" # dark, light, white, or classic
  rss = true # generate rss feed. default value is false
  googleAnalyticsAsync = true # use asynchronous tracking. Synchronous tracking by default
  showAllPostsArchive = false # default

  # Home page settings
  description = """

  Hi, I'm a postdoctoral research fellow in the Department of Linguistics at the University of Michigan.
  
  I completed my PhD in Neuroscience and Cognitive Science at the University of Maryland in the Department of Linguistics and was advised by [Dr. Naomi Feldman](http://users.umiacs.umd.edu/~nhf/) and [Dr. Bill Idsardi](https://wjidsardi.net/). 

  My research focuses on understanding speech perception and learning. I use whatever methods I feel are suited for the task at hand, which has thus far included behavioral experiments and computational modeling. 

  The questions that interest me most are those surrounding the structure of representations and learning, specifically as they relate to sound. What is the structure of phonological representations, how are they learned, and and how do they change with exposure to new languages? I think that second language acquisition and bilingualism provide an exciting test case to evaluate these questions. 
  
  I was lucky to complete my PhD with a fantastic linguistics cohort. You can find them here: [Katherine Howitt](https://www.katherinehowitt.com/research), Jingyi Chen, [London Dixon](https://www.londondixon.com/) , Fëdor Golosov, Zulfiyya Aghakishiyeva.
  
  """ 
  
  mainSection = "posts" # your main section
  mainSectionTitle = "..."
  showAllPostsOnHomePage = false # default
  postsOnHomePage = 0 # this option will be ignored if showAllPostsOnHomePage is set to true
  tagsOverview = true # show tags overview by default.
  showProjectsList = false # show projects list by default (if projects data file exists).

#   projectsUrl = "https://github.com/gohugoio" # title link for projects list

